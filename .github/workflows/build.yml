name: Build experimental OpenWrt 19.07.9

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/**"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "config.seed"

permissions:
  contents: read

concurrency:
  group: wr841hp-v3-backport
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl patch perl \
            cpio ecj fastjar java-propose-classpath
      - name: Fetch OpenWrt 19.07.9 source
        run: |
          git clone --depth 1 --branch v19.07.9 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
      - name: Backport device files to the 19.07.9 layout
        env:
          DEVICE_SUPPORT_COMMIT: c5235f6b2441a6b531622b76b66c354896c0dae0
        run: |
          set -euo pipefail
          cd openwrt
          git fetch --no-tags --depth=2 origin "$DEVICE_SUPPORT_COMMIT"

          # Apply only the new DTS from the upstream support commit. The full
          # commit does not apply to 19.07.9 because board.d paths and image
          # recipe context changed between branches.
          git show --format= --binary "$DEVICE_SUPPORT_COMMIT" -- target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts > /tmp/wr841hp-dts.patch
          test -s /tmp/wr841hp-dts.patch
          git apply --check /tmp/wr841hp-dts.patch
          git apply /tmp/wr841hp-dts.patch

          # Port the board defaults to the 19.07.9 base-files paths.
          python3 - <<'PY'
          from pathlib import Path

          leds = Path("target/linux/ath79/base-files/etc/board.d/01_leds")
          network = Path("target/linux/ath79/base-files/etc/board.d/02_network")
          image = Path("target/linux/ath79/image/generic-tp-link.mk")

          for p in (leds, network, image):
              if not p.is_file():
                  raise SystemExit(f"::error::Expected 19.07.9 file missing: {p}")

          s = leds.read_text()
          old = "tplink,archer-c60-v3)"
          new = "tplink,archer-c60-v3|\\\n\\ttplink,tl-wr841hp-v3)"
          if "tplink,tl-wr841hp-v3)" not in s:
              if old not in s:
                  raise SystemExit("::error::Cannot locate LED board case anchor in 19.07.9")
              s = s.replace(old, new, 1)
              leds.write_text(s)

          s = network.read_text()
          old = "qca,ap143-16m)"
          new = "qca,ap143-16m|\\\n\\ttplink,tl-wr841hp-v3)"
          if "tplink,tl-wr841hp-v3)" not in s:
              if old not in s:
                  raise SystemExit("::error::Cannot locate network board case anchor in 19.07.9")
              s = s.replace(old, new, 1)
              network.write_text(s)

          s = image.read_text()
          if "define Device/tplink_tl-wr841hp-v3" not in s:
              anchor = "define Device/tplink_tl-wr810n-v2"
              if anchor not in s:
                  raise SystemExit("::error::Cannot locate TP-Link 8 MB image recipe anchor")
              recipe = """define Device/tplink_tl-wr841hp-v3
            $(Device/tplink-8mlzma)
            ATH_SOC := qca9533
            DEVICE_TITLE := TP-Link TL-WR841HP v3
            TPLINK_HWID := 0x08411003
            SUPPORTED_DEVICES += tplink,tl-wr841hp-v3
          endef
          TARGET_DEVICES += tplink_tl-wr841hp-v3

          """
              s = s.replace(anchor, recipe + anchor, 1)
              image.write_text(s)
          PY

          # Optional repository-specific patches are applied after the base
          # backport; an empty patches/ directory is now valid.
          shopt -s nullglob
          patches=(../patches/*.patch)
          for p in "${patches[@]}"; do
            echo "Applying additional patch $p"
            git apply --check "$p"
            git apply "$p"
          done

          echo "Backport files staged in source tree:"
          git status --short
      - name: Update feeds and install package definitions
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Validate target, device profile, and openNDS
        run: |
          set -euo pipefail
          ./scripts/validate-backport.sh openwrt
      - name: Configure firmware
        run: |
          set -euo pipefail
          cd openwrt
          cp ../config.seed .config
          make defconfig
          ../scripts/validate-config.sh .config
      - name: Build toolchain and firmware
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" V=s
      - name: Verify output and size
        run: |
          set -euo pipefail
          cd openwrt
          ../scripts/verify-images.sh bin/targets/ath79/generic
      - name: Package logs and firmware
        if: success()
        run: |
          mkdir -p artifact
          cp -av openwrt/bin/targets/ath79/generic/* artifact/
          cp -av openwrt/.config artifact/build.config
          printf 'OpenWrt source commit: %s\n' "$SOURCE_COMMIT" > artifact/BUILD-INFO.txt
          printf 'Experimental backport; not verified on hardware.\n' >> artifact/BUILD-INFO.txt
          (cd artifact && sha256sum *.bin > SHA256SUMS.txt)
      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wr841hp-v3-openwrt-19.07.9-experimental
          path: artifact/
          if-no-files-found: error
          retention-days: 14
