name: Build experimental OpenWrt 19.07.9

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/**"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "config.seed"

permissions:
  contents: read

concurrency:
  group: wr841hp-v3-backport
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl patch perl \
            cpio ecj fastjar java-propose-classpath
      - name: Fetch OpenWrt 19.07.9 source
        run: |
          git clone --depth 1 --branch v19.07.9 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
      - name: Fetch and attempt upstream device-support backport
        env:
          DEVICE_SUPPORT_COMMIT: c5235f6b2441a6b531622b76b66c354896c0dae0
        run: |
          set -euo pipefail
          cd openwrt
          # Fetch the upstream commit that introduced official device support.
          # This is an attempt to port the real change, not a guarantee it applies
          # cleanly to the older 19.07.9 tree.
          git fetch --no-tags --depth=2 origin "$DEVICE_SUPPORT_COMMIT"
          git show --format= --binary "$DEVICE_SUPPORT_COMMIT" -- target/linux/ath79 > ../device-support-upstream.patch
          test -s ../device-support-upstream.patch || {
            echo "::error::Upstream commit contained no ath79 patch; inspect the commit and update the backport source."
            exit 1
          }
          echo "Generated patch from upstream device-support commit:"
          sed -n '1,100p' ../device-support-upstream.patch
          if git apply --check ../device-support-upstream.patch; then
            git apply ../device-support-upstream.patch
            echo "Upstream ath79 patch applied cleanly."
          else
            echo "::error::The upstream device patch does not apply cleanly to OpenWrt 19.07.9. Port the DTS, image recipe and target registration manually; do not skip this failure."
            exit 1
          fi
          # Optional user patches are applied after the upstream patch.
          shopt -s nullglob
          patches=(../patches/*.patch)
          for p in "${patches[@]}"; do
            echo "Applying additional patch $p"
            git apply --check "$p"
            git apply "$p"
          done
      - name: Update feeds and install package definitions
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Validate target, device profile, and openNDS
        run: |
          set -euo pipefail
          ./scripts/validate-backport.sh openwrt
      - name: Configure firmware
        run: |
          set -euo pipefail
          cd openwrt
          cp ../config.seed .config
          make defconfig
          ../scripts/validate-config.sh .config
      - name: Build toolchain and firmware
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" V=s
      - name: Verify output and size
        run: |
          set -euo pipefail
          cd openwrt
          ../scripts/verify-images.sh bin/targets/ath79/generic
      - name: Package logs and firmware
        if: success()
        run: |
          mkdir -p artifact
          cp -av openwrt/bin/targets/ath79/generic/* artifact/
          cp -av openwrt/.config artifact/build.config
          printf 'OpenWrt source commit: %s\n' "$SOURCE_COMMIT" > artifact/BUILD-INFO.txt
          printf 'Experimental backport; not verified on hardware.\n' >> artifact/BUILD-INFO.txt
          (cd artifact && sha256sum *.bin > SHA256SUMS.txt)
      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wr841hp-v3-openwrt-19.07.9-experimental
          path: artifact/
          if-no-files-found: error
          retention-days: 14
